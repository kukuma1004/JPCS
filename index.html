/* 주간 기록 — 매일 쓰기가 버거운 학생용.
   한 주를 통째로 한 번에 적습니다. 월요일 날짜로 저장하고 type='weekly' 로 구분합니다. */
function studentWeek(s){
  const wkStart=S.filter.week||wk(today());
  const wkEnd=addDays(wkStart,6);
  const j=C.journals.find(x=>x.studentId===s.id&&x.date===wkStart&&x.type==='weekly')
    ||{subjects:[{name:'',minutes:''}],difficult:[],memo:'',seed:'',mood:0,focus:0,good:'',hard:'',days:0,tags:[]};
  const tot=(j.subjects||[]).reduce((a,b)=>a+(Number(b.minutes)||0),0);
  const weeks=[]; for(let i=0;i<8;i++) weeks.push(addDays(wk(today()),-7*i));
  return `${topbar('이번 주 학습일지', j.id?'이미 쓴 주입니다. 고치고 저장하면 덮어써집니다.':'한 주를 한 번에 기록합니다',
    `<select data-act="setweek" style="width:auto">
      ${weeks.map(x=>`<option value="${x}" ${x===wkStart?'selected':''}>${kdate(x)} ~ ${kdate(addDays(x,6))}${x===wk(today())?' (이번 주)':''}</option>`).join('')}
     </select>
     <button class="btn sm" data-act="setmode" data-v="daily">매일 쓰기로</button>`)}
  <div class="wrap" style="max-width:700px">
    ${studentErrBanner()}${installCard()}
    ${j.id?`<div class="card mb" style="border-color:#c8ddd5;background:var(--accent-wash);box-shadow:none">
      <div class="card-b small" style="padding:11px 15px"><b>작성 완료</b> · 고치고 저장하면 덮어써집니다.</div></div>`:''}
    ${(()=>{const g=studyStats(s.id); return g.hours>=1?`<div class="card mb" style="box-shadow:none;background:var(--surface-2)">
      <div class="card-b row small" style="padding:11px 15px;gap:10px;flex-wrap:wrap">
        <span>${g.medal||'●'} 누적 <b>${g.hours}시간</b></span>
        ${g.next?`<span class="muted">다음 이정표 ${g.next}시간까지 ${hm(g.toNext)}</span>`:''}
      </div></div>`:''; })()}
    <form id="jform"><div class="card"><div class="card-b">
      <div class="spread mb"><h3 style="font-size:15px">이번 주에 무엇을 공부했나요?</h3>
        <span class="tag ${tot?'on':''}">합계 ${hm(tot)}</span></div>
      <div class="tiny muted mb-s">한 주 동안의 <b>총 시간</b>을 과목군별로 적어주세요.</div>
      <div id="subs">${(j.subjects.length?j.subjects:[{name:'',minutes:''}]).map(x=>subRow(x)).join('')}</div>
      <button type="button" class="btn sm" data-act="addsub">+ 과목 추가</button>

      <label class="f mt"><span>공부한 날 <em>7일 중 며칠</em></span>
        <div class="moodrow" style="grid-template-columns:repeat(8,1fr)">
          ${[0,1,2,3,4,5,6,7].map(d=>`<button type="button" class="moodbtn ${Number(j.days)===d?'on':''}"
            data-act="setdays" data-v="${d}">${d}</button>`).join('')}
        </div>
        <input type="hidden" name="days" id="daysval" value="${Number(j.days)||0}"></label>

      <div style="border-top:1px solid var(--line-2);margin:20px 0 16px"></div>
      <div class="spread mb"><h3 style="font-size:15px">어려웠던 내용</h3>
        <span class="tiny muted">선생님이 수업 보완에 참고합니다</span></div>
      <div id="diffs">${(j.difficult||[]).map(x=>diffRow(x)).join('')}</div>
      <button type="button" class="btn sm" data-act="adddiff">+ 어려웠던 내용 추가</button>

      <label class="f mt"><span>더 알아보고 싶어진 것 <em>선택</em></span>
        <textarea name="seed" rows="2" placeholder="공부하다 궁금해진 것을 적어두면 나중에 탐구활동으로 이어집니다.">${esc(j.seed||'')}</textarea></label>

      <label class="f"><span>이번 주 공부 집중도 <em>선택</em></span>
        <div class="moodrow" id="focusrow">
          ${FOCUS.map(([v,l])=>`<button type="button" class="moodbtn ${Number(j.focus)===v?'on':''}"
            data-act="setfocus" data-v="${v}">${l}</button>`).join('')}</div>
        <input type="hidden" name="focus" id="focusval" value="${Number(j.focus)||0}"></label>

      <div style="border-top:1px solid var(--line-2);margin:22px 0 16px"></div>

        <span class="tiny muted">전부 선택입니다</span></div>
      ${tagPick(j.tags,true)}

        <div class="moodrow" id="moodrow">
          ${MOODS.map(([v,l])=>`<button type="button" class="moodbtn ${Number(j.mood)===v?'on':''}"
            data-act="setmood" data-v="${v}">${l}</button>`).join('')}</div>
        <input type="hidden" name="mood" id="moodval" value="${Number(j.mood)||0}"></label>
      <label class="f"><span>이번 주 학교에서 기억에 남은 장면 <em>한 줄이면 충분합니다 · 선택</em></span>
        <textarea name="good" rows="2" placeholder="예) 모둠 의견이 갈렸을 때 친구들 이야기를 듣고 발표 순서를 함께 정했다.">${esc(j.good||'')}</textarea></label>
      <label class="f"><span>힘들었던 일 <em>선생님만 봅니다</em></span>
        <textarea name="hard" rows="2" placeholder="공부, 친구 관계, 몸 상태, 무엇이든 괜찮습니다.">${esc(j.hard||'')}</textarea></label>
      <label class="f" style="margin-bottom:8px"><span>이번 주 한 줄 <em>선택</em></span>
        <textarea name="memo" rows="2" placeholder="이번 주를 한 문장으로">${esc(j.memo||'')}</textarea></label>
      <button type="button" class="btn pri wide mt" data-act="saveweek">${j.id?'수정 저장':'주간 일지 저장'}</button>
    </div></div></form></div>`;
}

const tagPick = (sel,weekly)=>{
  const picked=sel||[];
  const button=t=>`<button type="button" class="tagbtn ${t.k==='none'?'none':''} ${picked.includes(t.k)?'on':''}"
    data-act="ttag" data-k="${t.k}">${t.label}</button>`;
  return `<div class="spread mb-s"><h3 style="font-size:15px">${weekly?'이번 주':'오늘'} 학교에서 이런 일 있었나요?</h3>

  <div class="life-groups" id="tagrow">
    ${LIFE_GROUPS.map(g=>`<div class="life-group"><div class="life-group-title">${g.label}</div>
      <div class="tagpick">${LIFE_TAGS.filter(t=>t.group===g.k).map(button).join('')}</div></div>`).join('')}
    <div class="tagpick life-none">${LIFE_TAGS.filter(t=>t.group==='none').map(button).join('')}</div>

  <input type="hidden" name="tags" id="tagval" value="${esc(picked.join(','))}">
  <div class="tiny muted mt-s" style="line-height:1.8">
    누르기만 해도 기록이 됩니다. 장면을 한 줄 더 적으면 담임 선생님이 학교생활을 훨씬 구체적으로 볼 수 있습니다.</div>`;
};

/* ── 공용 조각 ── */
function topbar(title,sub,extra=''){
  return `<div class="topbar noprint"><div class="grow"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${extra}</div>`;
}
function stat(n,l,d=''){ return `<div class="card stat"><div class="n mono">${n}</div><div class="l">${l}</div>${d?`<div class="d">${d}</div>`:''}</div>`; }
function barChart(data){
  const max=Math.max(...data.map(d=>d.value),60), W=Math.max(280,data.length*24), H=104, bw=W/data.length;
  return `<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;height:126px;overflow:visible">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/>
    ${data.map((d,i)=>{const h=d.value/max*(H-8);
      return `<g><rect x="${i*bw+bw*0.18}" y="${H-h}" width="${bw*0.64}" height="${Math.max(h,d.value?2:0)}" rx="2.5"
        fill="${d.value?'var(--accent)':'var(--line-2)'}" opacity="${d.value?.88:1}"><title>${d.label}: ${d.value?hm(d.value):'기록 없음'}</title></rect>
      ${data.length<=32?`<text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.label}</text>`:''}</g>`;}).join('')}
    <text x="0" y="9" font-size="9" fill="var(--muted)">${hm(max)}</text></svg>`;
}
function lineChart(data){
  const max=Math.max(...data.map(d=>d.value),60), W=340, H=104;
  const pts=data.map((d,i)=>[i/(data.length-1)*W,H-(d.value/max)*(H-10)]);
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:124px;overflow:visible">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/>
    <path d="${path} L${W},${H} L0,${H} Z" fill="var(--accent)" opacity=".08"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="var(--accent)" stroke-width="1.8">
      <title>${data[i].label}: ${hm(data[i].value)}${data[i].n!=null?` (${data[i].n}명)`:''}</title></circle>`).join('')}
    ${data.map((d,i)=>`<text x="${i/(data.length-1)*W}" y="${H+13}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.label}</text>`).join('')}
    <text x="0" y="9" font-size="9" fill="var(--muted)">${hm(max)}</text></svg>`;
}

function barList(pairs,fmt){

    <div class="meter"><i style="width:${v/max*100}%"></i></div></div>`).join('');
}

function bind(){
  $$('[data-act]').forEach(el=>{
    const act=el.dataset.act;
    if(el.tagName==='SELECT'||(el.tagName==='INPUT'&&el.type!=='checkbox')) el.onchange=()=>handle(act,el);
    else el.onclick=e=>{ if(el.dataset.act===act){e.preventDefault(); e.stopPropagation(); handle(act,el);} };
  });
}
async function busy(el,fn){
  if(S.busy) return; S.busy=true;
  const old=el?el.innerHTML:null;
  if(el){ el.disabled=true; el.innerHTML=`<span class="sp"></span> 작업 중…`; }
  try{ await fn(); }
  catch(e){ toast(e.message||String(e), 5000); if(e.nokey){ S.view='settings'; render(); } }
  finally{ S.busy=false; if(el&&document.body.contains(el)){ el.disabled=false; el.innerHTML=old; } }
}

  genbatch(){ busy(el,async()=>{
    const ids=$$('.expsel:checked').map(c=>c.value);
    if(!ids.length){ toast('학생을 선택해주세요'); return; }
    settings.anon=$('#anon').checked;
    let ok=0,fail=0;
    $('#exportout').innerHTML=`<div class="card"><div class="card-h"><h3>생성 중</h3></div><div class="card-b" id="batchlog"></div></div>`;
    for(const id of ids){
      const s=student(id);
      $('#batchlog').insertAdjacentHTML('beforeend',`<div class="small" id="b-${id}">· ${esc(s.name)} 생성 중…</div>`);
      try{ const out=await genRecord(id,S.area);
        const a=AREAS[S.area];
        const r=recs({studentId:id,area:S.area})[0]
          || {studentId:id,area:S.area,year:curYear(),level:S.filter.batchLv||'B',
              target:a.bytes,meta:{},fields:{},status:'draft'};
        // 행특은 자동으로 모인 근거로 만들었으므로, 그 근거도 함께 남겨 둡니다
        if(S.area==='haengteuk' && !Object.values(r.fields||{}).some(v=>String(v||'').trim())){
          const ev=htEvidence(id); r.fields={...(r.fields||{})};
          HT_AXES.forEach(x=>{ const t=htText(ev[x.k]); if(t) r.fields[x.k]=t; });
        }
        r.text=out; await DB.put('records',r);
        $('#b-'+id).innerHTML=`<span style="color:#3f7a34">✓</span> ${esc(s.name)} · ${bytes(out).toLocaleString()}byte · ${sentCount(out)}문장`; ok++;
      }catch(e){ $('#b-'+id).innerHTML=`<span style="color:var(--danger)">✗</span> ${esc(s.name)} · ${esc(e.message)}`; fail++;
        if(e.nokey) break; }
    }
    $('#batchlog').insertAdjacentHTML('beforeend',
      `<div class="row mt"><b class="small">완료 ${ok}건${fail?` · 실패 ${fail}건`:''}</b>

// 학생 로그인. 코드 입력과 자동 링크(?c=코드)가 같은 경로를 씁니다.
async function studentSignIn(code){
  code=String(code||'').trim().toUpperCase();
  if(code.length<4) throw new Error('접속코드를 정확히 입력해주세요.');
  await initFB(); const {doc,getDoc,setDoc}=FB.fs;
  const cs=await getDoc(doc(FB.db,'codes',code));
  if(!cs.exists()) throw new Error('없는 코드입니다. 선생님께 확인해주세요.');
  const {schoolId,studentId}=cs.data();
  const email=`stu.${code.toLowerCase()}@girokshil.app`, pw=`GS!${code}!${schoolId.slice(0,6)}`;
  let cred;
  try{ cred=await FB.au.signInWithEmailAndPassword(FB.auth,email,pw); }
  catch(e){ if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'){
      cred=await FB.au.createUserWithEmailAndPassword(FB.auth,email,pw).catch(er=>{throw new Error(emsg(er));});
      await setDoc(doc(FB.db,'users',cred.user.uid),{schoolId,studentId,role:'student',name:'',accessCode:code,approved:true});
    } else throw new Error(emsg(e)); }
  await afterAuth(cred.user);
  // 주소창에 코드가 남지 않게 정리합니다 (기록·공유 시 노출 방지)
  try{ history.replaceState(null,'',location.pathname+'?student'); }catch(e){}
}

// 규칙 배포 전에 만들어진 "계정만 있고 프로필은 없는" 상태를 자연스럽게 복구한다
async function signUpOrIn(email,pw){
  try{ return await FB.au.createUserWithEmailAndPassword(FB.auth,email,pw); }
  catch(e){
    if(e.code==='auth/email-already-in-use'){
      try{ return await FB.au.signInWithEmailAndPassword(FB.auth,email,pw); }
      catch(e2){ throw new Error('이미 있는 이메일입니다. 비밀번호가 다르면 다른 이메일을 쓰거나 비밀번호를 확인해주세요.'); }
    }
    throw new Error(emsg(e));
  }
}
// 교사는 자기 담당 학급 안에서만 명단을 건드릴 수 있습니다
function canManage(grade,klass){
  if(isAdmin()) return true;
  const mine=myAreaKeys();
  if(mine.includes(ckey(grade,klass))) return true;
  toast(`담당 학급이 아닙니다. ${mine.map(klassLabel).join(', ')||'배정된 학급 없음'} 안에서만 추가할 수 있습니다.`,5000);
  return false;
}
async function addStudent(o){
  const year=Number(o.year||curYear());
  const s={ id:rid(), name:o.name, year, grade:o.grade, klass:o.klass, number:o.number,
    code:`${o.grade}-${o.klass}-${o.number}`, classKey:ckey(o.grade,o.klass),
    cohort:o.cohort||year-(o.grade-1), accessCode:o.accessCode||newCode(), history:[] };
  if(DB.cloud){ const {doc,setDoc}=FB.fs;
    await setDoc(doc(FB.db,'codes',s.accessCode),{schoolId:S.school.id,studentId:s.id}); }
  await DB.put('students',s);
  return s;
}
// 이미 있는 학생을 새 학년도로 올린다 (접속코드는 그대로 유지)
async function enrollStudent(s,o){
  const year=Number(o.year||curYear());
  if(Number(s.year)===year){                       // 같은 학년도면 정보만 수정
    return DB.put('students',{...s,grade:o.grade,klass:o.klass,number:o.number,
      code:`${o.grade}-${o.klass}-${o.number}`,classKey:ckey(o.grade,o.klass),
      name:o.name||s.name});
  }
  const hist=[...(s.history||[]).filter(h=>Number(h.year)!==Number(s.year)),
              {year:Number(s.year),grade:s.grade,klass:s.klass,number:s.number}];
  return DB.put('students',{...s, year, grade:o.grade, klass:o.klass, number:o.number,
    code:`${o.grade}-${o.klass}-${o.number}`, classKey:ckey(o.grade,o.klass),
    name:o.name||s.name, history:hist});
}
async function saveRecord(){
  const f=$('#recform'); if(!f) return;
  const area=f.dataset.area, a=AREAS[area];
  const cur=recs({studentId:S.sel,area})[0];
  const obj={id:cur?.id,studentId:S.sel,area,year:curYear(),meta:{},fields:{}};
  new FormData(f).forEach((v,k)=>{
    if(k.startsWith('meta.')) obj.meta[k.slice(5)]=v;
    else if(k.startsWith('fields.')) obj.fields[k.slice(7)]=v;
    else obj[k]=v; });
  obj.target=Number(obj.target)||a.bytes;
  await DB.put('records',obj);
}
/* 나의 소개 저장 — 학생 본인이 씁니다.
   students 문서의 profile 필드만 건드리므로, 보안 규칙에서도 그 두 필드만 열어두었습니다. */
async function saveProfile(){
  const s=student(S.me.studentId);
  const pf={}; PROFILE_FIELDS.forEach(f=>{ pf[f.k]=($(`[name=${f.k}]`)?.value||'').trim(); });
  if(!Object.values(pf).some(v=>v)){ toast('한 항목이라도 적어주세요'); return; }
  try{
    await DB.put('students',{id:s.id, profile:pf, profileAt:Date.now()});
    toast('저장했습니다. 선생님이 상담할 때 봅니다.');
    render();
  }catch(e){
    if(e?.code==='permission-denied')
      toast('보안 규칙이 아직 옛 버전입니다. 선생님께 firestore.rules 갱신을 알려주세요.',5000);
    else toast('저장하지 못했습니다: '+emsg(e),4500);
  }
}

async function saveWeek(){
  const s=student(S.me.studentId), wkStart=S.filter.week||wk(today());
  const subs=$$('#subs .subrow').map(r=>{
    const h=Number(r.querySelector('.jsub-h').value)||0, mm=Number(r.querySelector('.jsub-mm').value)||0;
    const g=r.querySelector('.jsub-g').value, nm=r.querySelector('.jsub-n').value.trim();
    return {group:g, name:nm||g, minutes:h*60+mm};
  }).filter(x=>x.group&&x.minutes>0);
  const difficult=$$('#diffs .diffrow').map(r=>({subject:r.querySelector('.jdif-s').value.trim(),
    content:r.querySelector('.jdif-c').value.trim()})).filter(x=>x.content);
  const days=Number($('#daysval')?.value)||0;
  const tags=($('#tagval')?.value||'').split(',').filter(Boolean);
  const any = subs.length||days||Number($('#moodval')?.value)||Number($('#focusval')?.value)||tags.length
    ||$('[name=good]')?.value.trim()||$('[name=hard]')?.value.trim()||$('[name=memo]')?.value.trim();
  if(!any){ toast('공부 기록이나 학교생활 내용 중 하나는 채워주세요'); return; }
  const same=C.journals.filter(x=>x.studentId===s.id&&x.date===wkStart&&x.type==='weekly')
    .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  for(const extra of same.slice(1)) await DB.del('journals',extra.id);
  await DB.put('journals',{id:same[0]?.id,studentId:s.id,date:wkStart,type:'weekly',
    subjects:subs,totalMinutes:subs.reduce((a,b)=>a+b.minutes,0),days,difficult,
    memo:$('[name=memo]').value.trim(),seed:$('[name=seed]').value.trim(),
    mood:Number($('#moodval')?.value)||0, focus:Number($('#focusval')?.value)||0,
    good:$('[name=good]')?.value.trim()||'', hard:$('[name=hard]')?.value.trim()||'', tags});
  toast('주간 일지를 저장했습니다'); S.view='mine'; S.filter.week=null; render();
}

async function saveJournal(){

  const subs=$$('#subs .subrow').map(r=>{
    const h=Number(r.querySelector('.jsub-h').value)||0, mm=Number(r.querySelector('.jsub-mm').value)||0;
    const g=r.querySelector('.jsub-g').value, nm=r.querySelector('.jsub-n').value.trim();
    return {group:g, name:nm||g, minutes:h*60+mm};

/* ── 호스트 판정 ──
   hosts 문서를 직접 읽는 대신 "학교 목록 조회가 되는가"로 판정합니다.
   규칙상 학교 목록 조회는 호스트에게만 열려 있으므로, 성공하면 곧 호스트입니다.
   실제로 쓸 권한을 시험하는 방식이라 문서 읽기 권한과 어긋날 일이 없습니다. */
async function checkHost(uid){
  S.isHost=false; S.hostErr=''; S.hostProbe=null;
  const id=uid||S.uid;
  const {doc,getDoc,collection,getDocs}=FB.fs;
  const probe={docRead:null,docExists:null,listOk:null,raw:''};

  try{ const d=await getDoc(doc(FB.db,'hosts',id));
    probe.docRead=true; probe.docExists=d.exists();
  }catch(e){ probe.docRead=false; probe.raw=`hosts 읽기: ${e.code||e.message}`; }

  try{ const snap=await getDocs(collection(FB.db,'schools'));
    probe.listOk=true; S.isHost=true;
    S.schools=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){ probe.listOk=false;
    if(e.code!=='permission-denied') probe.raw+=` / 학교목록: ${e.code||e.message}`; }

  S.hostProbe=probe;
  // 문서는 있는데 목록 조회가 막힌다 = 규칙이 옛 버전
  if(!S.isHost && probe.docExists===true)
    S.hostErr='hosts 문서는 있는데 학교 목록 조회가 막혀 있습니다. 규칙의 schools 항목에 isHost()가 반영되지 않았습니다.';
  else if(!S.isHost && probe.docRead===false)
    S.hostErr='보안 규칙이 hosts 읽기를 막고 있습니다. 규칙이 실제로 게시되었는지 확인해주세요.';
  return S.isHost;
}
function hostProbeHtml(){
  const p=S.hostProbe; if(!p) return '';
  const row=(n,v,t,f)=>`<div class="row tiny" style="gap:8px;padding:4px 0">
    <span style="flex:none;width:14px;color:${v?'#3f7a34':'var(--danger)'}">${v?'✓':'✗'}</span>
    <span class="grow">${n}</span><span class="muted">${v?t:f}</span></div>`;
  return `<div class="card mt" style="box-shadow:none;background:var(--surface-2)"><div class="card-b" style="padding:12px 14px">
    <b class="tiny">확인 결과</b>
    ${row('hosts 문서 읽기 권한',p.docRead,'열려 있음','규칙에 hosts 항목 없음')}
    ${row('hosts 문서 존재',p.docExists,'있음','없음')}
    ${row('학교 목록 조회 권한',p.listOk,'열려 있음','막힘')}
    ${p.raw?`<div class="tiny muted mt-s" style="word-break:break-all">${esc(p.raw)}</div>`:''}
    <button class="btn sm mt-s" data-act="copyprobe">진단 결과 복사</button>
    <div class="tiny muted mt-s" style="line-height:1.85">
      ${p.docRead&&p.docExists&&p.listOk?'모두 정상입니다.'
      :!p.docRead?'규칙이 게시되지 않았습니다. Firestore → 규칙 탭 위쪽의 <b>마지막 게시 시각</b>이 방금인지 확인하세요. 붙여넣기만 하고 게시 버튼을 안 누른 경우가 가장 많습니다.'
      :!p.docExists?'규칙은 정상입니다. hosts 컬렉션에 문서 ID가 위 uid와 <b>정확히 같은</b> 문서를 만들어주세요.'
      :'규칙이 옛 버전입니다. schools 항목의 allow list가 isHost()로 되어 있는지 확인하고 다시 게시하세요.'}
    </div></div></div>`;
}

async function afterAuth(user){
  const {doc,getDoc}=FB.fs;
  // 호스트 여부는 콘솔에서 직접 만든 hosts/{uid} 문서로만 정해진다 (스스로 부여 불가)
  await checkHost(user.uid);
  const p=await getDoc(doc(FB.db,'users',user.uid));
  if(!p.exists() && S.isHost){          // 학교 소속 없는 순수 호스트
    S.me={uid:user.uid,role:'host',name:user.email||'호스트',email:user.email};
    S.uid=user.uid; S.mode='cloud'; DB.cloud=true; S.school=null; S.authMsg='';
    render();
    const {collection,getDocs}=FB.fs;
    try{ const snap=await getDocs(collection(FB.db,'schools'));
      S.schools=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    }catch(e){ S.schools=[]; toast('학교 목록을 불러오지 못했습니다. 규칙을 확인해주세요',5000); }
    render(); return;
  }
  if(!p.exists()){
    S.authMsg='로그인은 됐지만 프로필 문서가 없습니다. 가입이 중간에 끊겼거나 규칙이 막고 있을 수 있습니다.';
    S.mode=null; render(); return; }
  S.me={uid:user.uid,...p.data()}; S.uid=user.uid;
  const sc=await getDoc(doc(FB.db,'schools',S.me.schoolId));
  S.school={id:S.me.schoolId,...(sc.data()||{name:''})};
  if(!S.school.currentYear) S.school.currentYear=schoolYear();
  S.year=Number(S.school.currentYear);
  DB.cloud=true; S.mode='cloud'; S.authMsg='';
  await DB.loadAll();
  S.view=S.me.role==='student'?'write':'home';
  render();
  if(S.me.role==='admin') updateSchoolStats();
}
// 호스트 콘솔에 보여줄 집계치만 학교 문서에 남긴다 (개인정보는 담지 않는다)
async function updateSchoolStats(){
  if(!DB.cloud) return;
  try{ const {doc,setDoc}=FB.fs;
    await setDoc(doc(FB.db,'schools',S.school.id),{stats:{
      students:C.students.length, records:C.records.length,
      journals:C.journals.length, teachers:(S.teachers||[]).length||null,
      updatedAt:Date.now()}},{merge:true});
  }catch(e){}
}
async function boot(){
  S.auth=startSide();
  const q=new URLSearchParams(location.search);
  const autoCode=(q.get('c')||'').trim().toUpperCase();
  const token=q.get('r');
  if(token){ S.share='loading'; render();
    try{ await initFB(); const {doc,getDoc}=FB.fs;
      const d=await getDoc(doc(FB.db,'shares',token));
      if(!d.exists()) throw 0;
      const p=d.data();
      if(p.expires && p.expires<today()) throw 0;
      S.share=p;
    }catch(e){ S.share='error'; }
    render(); return; }
  try{
    await initFB();
    FB.au.onAuthStateChanged(FB.auth, async u=>{
      if(u && !S.mode){ try{ await afterAuth(u); }catch(e){ S.authMsg=emsg(e); render(); } }
      else if(!u && !S.mode){
        if(autoCode){ S.auth='student'; render();
          try{ await studentSignIn(autoCode); }
          catch(e){ S.authMsg=e.message||String(e); render(); }
        } else render();
      }
    });
  }catch(e){ S.authMsg='Firebase 연결에 실패했습니다. 데모 모드로 둘러보실 수 있습니다.'; render(); }
}
/* ── 홈 화면 앱으로 설치 ──
   웹 알림을 보내려면 결국 학생 폰에 앱이 "설치"되어 있어야 합니다.
   특히 아이폰은 홈 화면에 추가하지 않으면 알림이 원천적으로 안 옵니다.
   그래서 설치를 눈에 띄게 안내합니다. */
const PWA = { prompt:null, installed:false };
PWA.standalone = () => { try{ return window.matchMedia?.('(display-mode: standalone)').matches
    || navigator.standalone===true; }catch(e){ return false; } };
PWA.ios = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt=e;
  if(S.mode) render(); });
window.addEventListener('appinstalled', () => { PWA.installed=true; PWA.prompt=null;
  toast('홈 화면에 설치했습니다'); if(S.mode) render(); });
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
/* 학생 화면 위쪽에 한 번 보여주는 설치 안내 */
function installCard(){
  if(PWA.standalone() || PWA.installed || LS.get('gs.nopwa')) return '';
  if(location.protocol==='file:') return '';
  return `<div class="card mb" style="border-color:#c8ddd5;background:var(--accent-wash);box-shadow:none">
    <div class="card-b" style="padding:13px 15px">
      <div class="spread" style="align-items:flex-start;gap:10px">
        <div><b class="small">홈 화면에 앱으로 두면 훨씬 편합니다</b>
          <div class="tiny muted mt-s" style="line-height:1.85">${PWA.ios()
            ? '아래 <b>공유 버튼(⬆)</b> → <b>홈 화면에 추가</b> 를 누르세요. 아이콘이 생기고 주소창 없이 열립니다.'
            : PWA.prompt ? '한 번 누르면 아이콘이 생기고, 다음부터는 접속코드도 다시 넣지 않아도 됩니다.'
            : '브라우저 메뉴(⋮) → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b> 를 누르세요.'}</div></div>
        <span class="row" style="gap:6px;flex-shrink:0">
          ${PWA.prompt?`<button class="btn pri sm" data-act="pwainstall">설치</button>`:''}
          <button class="btn ghost sm" data-act="pwadismiss">나중에</button></span>
      </div></div></div>`;
}

settings.migrate();
boot();
